<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a1a2e">
<title>高中公式手册</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  min-height: 100vh; background-attachment: fixed; color: var(--text);
  transition: background .4s, color .3s;
  --text: #2b2b2b; --text-soft: #5a5a5a;
  --card-bg: rgba(255,255,255,.78); --card-border: rgba(0,0,0,.06);
  --accent: #7f5af0; --accent-soft: rgba(127,90,240,.12);
  --shadow: 0 4px 20px rgba(0,0,0,.06); --topbar-bg: rgba(255,255,255,.6);
}
body.dark {
  --text: #e8e8f0; --text-soft: #a8a8b8;
  --card-bg: rgba(26,26,40,.66); --card-border: rgba(255,255,255,.08);
  --accent: #9d7bff; --accent-soft: rgba(157,123,255,.18);
  --shadow: 0 4px 20px rgba(0,0,0,.3); --topbar-bg: rgba(16,16,28,.6);
}
#app { max-width: 760px; margin: 0 auto; padding: 0 14px 100px; }
.topbar {
  position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 8px;
  padding: 12px 18px; background: var(--topbar-bg);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--card-border); margin: 0 -14px;
}
.topbar h1 { flex: 1; font-size: 18px; margin: 0; text-align: center; font-weight: 600; }
.icon-btn { background: transparent; border: none; font-size: 20px; color: var(--text); cursor: pointer; padding: 6px 8px; border-radius: 10px; line-height: 1; }
.icon-btn:active { background: var(--accent-soft); }
.search-wrap { display: flex; gap: 8px; margin: 12px 0; }
.search-wrap input { flex: 1; padding: 12px 16px; border-radius: 14px; border: 1px solid var(--card-border); background: var(--card-bg); color: var(--text); font-size: 15px; outline: none; backdrop-filter: blur(10px); }
.search-wrap input:focus { border-color: var(--accent); }
.search-wrap .icon-btn { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 14px; padding: 0 14px; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(360px, 86vw); background: var(--card-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-left: 1px solid var(--card-border); padding: 20px 18px; overflow-y: auto; z-index: 50; box-shadow: -8px 0 30px rgba(0,0,0,.15); transition: transform .3s; }
.drawer.hidden { transform: translateX(110%); }
.drawer h2 { font-size: 17px; margin: 0 0 14px; }
.filter-group { margin-bottom: 16px; }
.filter-group > label { display: block; font-size: 13px; color: var(--text-soft); margin-bottom: 8px; }
.chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 7px 14px; border-radius: 20px; font-size: 13px; border: 1px solid var(--card-border); background: rgba(128,128,128,.08); color: var(--text); cursor: pointer; transition: all .2s; }
.chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn { display: block; width: 100%; padding: 11px; margin-top: 8px; border-radius: 12px; border: none; font-size: 14px; background: var(--accent); color: #fff; cursor: pointer; }
.btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--card-border); }
.bg-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-height: 300px; overflow-y: auto; padding-right: 4px; }
.bg-item { cursor: pointer; text-align: center; font-size: 11px; color: var(--text-soft); }
.bg-item .bg-preview { height: 52px; border-radius: 10px; border: 2px solid transparent; margin-bottom: 4px; transition: border-color .2s; }
.bg-item.active .bg-preview { border-color: var(--accent); }
.gradient-picker { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
.gradient-picker input[type=color] { width: 40px; height: 36px; border: none; border-radius: 8px; padding: 0; background: none; }
.gradient-picker .btn { margin-top: 0; flex: 1; }
.group-title { font-size: 14px; color: var(--accent); font-weight: 600; margin: 22px 0 10px; padding-left: 4px; letter-spacing: .5px; }
.formula-list { display: flex; flex-direction: column; gap: 12px; }
.card { background: var(--card-bg); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid var(--card-border); border-radius: 18px; padding: 16px 16px 14px; box-shadow: var(--shadow); transition: transform .2s; }
.card:active { transform: scale(.995); }
.card-head { display: flex; align-items: flex-start; gap: 8px; }
.card-title { flex: 1; font-size: 15px; margin: 0; font-weight: 600; }
.card-actions { display: flex; gap: 2px; }
.card-actions .icon-btn { font-size: 16px; padding: 4px 6px; }
.fav-btn.active { color: #f5a623; }
.formula { font-size: 18px; text-align: center; padding: 12px 4px; overflow-x: auto; color: var(--text); }
.formula .katex { font-size: 1.15em; }
.section { margin-top: 10px; }
.section .label { display: inline-block; font-size: 11px; color: var(--accent); background: var(--accent-soft); padding: 2px 8px; border-radius: 6px; margin-bottom: 6px; }
.variant { font-size: 13px; color: var(--text-soft); padding: 3px 0 3px 10px; border-left: 2px solid var(--accent-soft); margin-bottom: 4px; font-family: "Cambria Math", "Times New Roman", serif; }
.section .text { font-size: 13px; color: var(--text-soft); line-height: 1.6; }
.meta { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
.meta-item { font-size: 12px; color: var(--text-soft); background: rgba(128,128,128,.08); padding: 4px 10px; border-radius: 8px; }
.meta-item b { color: var(--accent); margin-right: 4px; font-weight: 500; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.tag { font-size: 11px; padding: 3px 9px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); }
.empty-tip { text-align: center; color: var(--text-soft); padding: 60px 0; font-size: 14px; }
.hidden { display: none !important; }
.fab { position: fixed; right: 22px; bottom: 28px; z-index: 40; width: 56px; height: 56px; border-radius: 50%; border: none; background: var(--accent); color: #fff; font-size: 28px; box-shadow: 0 6px 20px rgba(127,90,240,.4); cursor: pointer; line-height: 1; }
.modal { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.45); backdrop-filter: blur(4px); display: flex; align-items: flex-end; justify-content: center; }
.modal-card { background: var(--card-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); width: 100%; max-width: 760px; max-height: 88vh; overflow-y: auto; border-radius: 22px 22px 0 0; padding: 22px 20px 30px; box-shadow: 0 -8px 30px rgba(0,0,0,.2); }
.modal-card h2 { margin: 0 0 16px; font-size: 18px; }
.modal-card label { display: block; font-size: 13px; color: var(--text-soft); margin-bottom: 12px; }
.modal-card input, .modal-card textarea, .modal-card select { width: 100%; margin-top: 5px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--card-border); background: rgba(128,128,128,.08); color: var(--text); font-size: 14px; font-family: inherit; outline: none; }
.modal-card input:focus, .modal-card textarea:focus, .modal-card select:focus { border-color: var(--accent); }
.modal-card textarea { resize: vertical; }
.modal-actions { display: flex; gap: 10px; margin-top: 16px; }
.modal-actions .btn { margin-top: 0; }
.hint { font-size: 12px; color: var(--text-soft); line-height: 1.5; }
.toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: rgba(30,30,40,.92); color: #fff; padding: 10px 20px; border-radius: 12px; font-size: 14px; z-index: 80; box-shadow: 0 4px 20px rgba(0,0,0,.3); animation: toastIn .3s ease; }
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }
@media (max-width: 480px) { .card { padding: 14px 14px 12px; border-radius: 16px; } .formula { font-size: 16px; } .topbar h1 { font-size: 16px; } }
</style>
</head>
<body class="light">
<div id="app">
  <header class="topbar">
    <button id="btn-filter" class="icon-btn" aria-label="筛选">⛃</button>
    <h1>高中公式手册</h1>
    <button id="btn-settings" class="icon-btn" aria-label="设置">⚙</button>
  </header>
  <div class="search-wrap">
    <input id="search-input" type="search" placeholder="搜索公式、关键词…" autocomplete="off">
  </div>
  <aside id="filter-panel" class="drawer hidden">
    <h2>筛选</h2>
    <div class="filter-group"><label>学科</label><div id="filter-subject" class="chip-row"></div></div>
    <div class="filter-group"><label>年级</label><div id="filter-grade" class="chip-row"></div></div>
    <div class="filter-group"><label>模块</label><div id="filter-module" class="chip-row"></div></div>
    <div class="filter-group"><label>标签</label><div id="filter-tag" class="chip-row"></div></div>
    <div class="filter-group"><label><input type="checkbox" id="only-fav"> 只看收藏</label></div>
    <button id="btn-clear-filter" class="btn">清空筛选</button>
    <button id="btn-close-filter" class="btn btn-ghost">关闭</button>
  </aside>
  <aside id="settings-panel" class="drawer hidden">
    <h2>外观设置</h2>
    <div class="filter-group"><label>主题</label><div class="chip-row">
      <button class="chip" data-theme="light">浅色</button>
      <button class="chip" data-theme="dark">深色</button>
      <button class="chip" data-theme="auto">跟随系统</button>
    </div></div>
    <div class="filter-group"><label>背景类别</label><div id="bg-categories" class="chip-row"></div></div>
    <div class="filter-group"><label>选择背景</label><div id="bg-grid" class="bg-grid"></div></div>
    <div class="filter-group"><label>自定义背景</label>
      <input type="file" id="bg-upload" accept="image/*" hidden>
      <button class="btn" id="btn-upload-bg">上传图片作背景</button>
      <div class="gradient-picker">
        <input type="color" id="grad-c1" value="#1a1a2e">
        <input type="color" id="grad-c2" value="#16213e">
        <button class="btn" id="btn-apply-grad">应用渐变色</button>
      </div>
    </div>
    <div class="filter-group"><label>数据</label>
      <button class="btn" id="btn-export">导出备份</button>
      <button class="btn" id="btn-import">导入备份</button>
      <button class="btn" id="btn-batch">批量导入公式</button>
      <input type="file" id="import-file" accept=".json" hidden>
    </div>
    <button id="btn-close-settings" class="btn btn-ghost">关闭</button>
  </aside>
  <main id="content">
    <div id="formula-list" class="formula-list"></div>
    <div id="empty-tip" class="empty-tip hidden">没有匹配的公式</div>
  </main>
  <button id="btn-add" class="fab" aria-label="添加公式">＋</button>
  <div id="edit-modal" class="modal hidden">
    <div class="modal-card">
      <h2 id="edit-title">添加公式</h2>
      <label>标题<input id="f-title" type="text" placeholder="如：勾股定理"></label>
      <label>公式（支持 LaTeX，如 a^2+b^2=c^2）<textarea id="f-latex" rows="2"></textarea></label>
      <label>等价变形（每行一条）<textarea id="f-variants" rows="3"></textarea></label>
      <label>典型应用/思路<textarea id="f-usage" rows="3"></textarea></label>
      <label>说明<textarea id="f-desc" rows="2"></textarea></label>
      <label>适用条件<input id="f-cond" type="text"></label>
      <label>单位<input id="f-unit" type="text"></label>
      <label>学科<select id="f-subject"><option value="math">数学</option><option value="physics">物理</option></select></label>
      <label>年级<select id="f-grade"><option value="g1">高一</option><option value="g2">高二</option><option value="g3">高三</option></select></label>
      <label>模块<input id="f-module" type="text" placeholder="如：函数、力学"></label>
      <label>标签（逗号分隔）<input id="f-tags" type="text" placeholder="易错,重点"></label>
      <div class="modal-actions">
        <button id="btn-save-formula" class="btn">保存</button>
        <button id="btn-cancel-formula" class="btn btn-ghost">取消</button>
      </div>
    </div>
  </div>
  <div id="batch-modal" class="modal hidden">
    <div class="modal-card">
      <h2>批量导入</h2>
      <p class="hint">粘贴 JSON 数组，字段：title, latex, variants[], usage, desc, cond, unit, subject, grade, module, tags[]</p>
      <textarea id="batch-text" rows="10" placeholder='[{"title":"勾股定理","latex":"a^2+b^2=c^2"}]'></textarea>
      <div class="modal-actions">
        <button id="btn-batch-import" class="btn">导入</button>
        <button id="btn-batch-cancel" class="btn btn-ghost">取消</button>
      </div>
    </div>
  </div>
  <div id="toast" class="toast hidden"></div>
</div>

<script>
/* ================= 背景库（80套） ================= */
const BACKGROUNDS = (() => {
  const list = []; let id = 0;
  const push = (cat, name, cssLight, cssDark) => list.push({ id: 'bg-' + (++id), cat, name, cssLight, cssDark });
  const stars = [
    ['深空星点','radial-gradient(circle at 20% 30%, #fff 1px, transparent 1px) 0 0/40px 40px, linear-gradient(160deg,#0b1026,#1a1a2e)','radial-gradient(circle at 20% 30%, #fff 1px, transparent 1px) 0 0/40px 40px, linear-gradient(160deg,#05060d,#121226)'],
    ['银河','linear-gradient(135deg,#1b1b3a 0%,#3a2a5e 40%,#0e1a2e 100%)','linear-gradient(135deg,#0a0a18 0%,#1e1533 40%,#060d18 100%)'],
    ['星轨旋涡','conic-gradient(from 0deg at 50% 50%, #1a1a2e, #2e2e5e, #1a1a2e, #3a3a6e, #1a1a2e)','conic-gradient(from 0deg at 50% 50%, #0b0b1a, #1c1c3a, #0b0b1a, #252550, #0b0b1a)'],
    ['夜空渐变','linear-gradient(180deg,#0f2027,#203a43,#2c5364)','linear-gradient(180deg,#070f12,#101d22,#162a33)'],
    ['流星','radial-gradient(ellipse at 70% 20%, rgba(255,255,255,.9), transparent 30%), linear-gradient(160deg,#0b1026,#1a1a2e)','radial-gradient(ellipse at 70% 20%, rgba(255,255,255,.7), transparent 30%), linear-gradient(160deg,#05060d,#121226)'],
    ['繁星点点','radial-gradient(1px 1px at 10% 10%,#fff,transparent), radial-gradient(1px 1px at 30% 60%,#fff,transparent), radial-gradient(1px 1px at 80% 30%,#fff,transparent), linear-gradient(180deg,#141e30,#243b55)','radial-gradient(1px 1px at 10% 10%,#fff,transparent), radial-gradient(1px 1px at 30% 60%,#fff,transparent), radial-gradient(1px 1px at 80% 30%,#fff,transparent), linear-gradient(180deg,#0a0f18,#121f2b)'],
    ['极光','linear-gradient(160deg,#0f2027,#2c5364,#7f5af0 80%)','linear-gradient(160deg,#070f12,#162a33,#4a32a0 80%)'],
    ['深蓝星海','linear-gradient(180deg,#000428,#004e92)','linear-gradient(180deg,#00020f,#00295a)'],
    ['紫夜','linear-gradient(135deg,#2b1055,#7597de)','linear-gradient(135deg,#14082a,#3a4f8a)'],
    ['星云','radial-gradient(ellipse at 30% 30%, rgba(127,90,240,.5), transparent 50%), radial-gradient(ellipse at 70% 70%, rgba(52,211,153,.4), transparent 50%), linear-gradient(160deg,#0b1026,#1a1a2e)','radial-gradient(ellipse at 30% 30%, rgba(127,90,240,.4), transparent 50%), radial-gradient(ellipse at 70% 70%, rgba(52,211,153,.3), transparent 50%), linear-gradient(160deg,#05060d,#121226)']
  ];
  stars.forEach(([n,l,d]) => push('星空', n, l, d));
  const nature = [
    ['嫩芽','linear-gradient(160deg,#d4fc79,#96e6a1)','linear-gradient(160deg,#1e2a1a,#2f4a32)'],
    ['花瓣','linear-gradient(135deg,#ffdde1,#ee9ca7)','linear-gradient(135deg,#2a1a1e,#4a2a32)'],
    ['森林雾','linear-gradient(160deg,#cfd9df,#e2ebf0)','linear-gradient(160deg,#1a2326,#28343a)'],
    ['春日草地','linear-gradient(180deg,#a8e063,#56ab2f)','linear-gradient(180deg,#1a2a12,#2a4a1a)'],
    ['樱花','linear-gradient(135deg,#fbc2eb,#a6c1ee)','linear-gradient(135deg,#2a1a2e,#1a2438)'],
    ['海风','linear-gradient(180deg,#89f7fe,#66a6ff)','linear-gradient(180deg,#0d2a33,#1a2f5a)'],
    ['暖阳','linear-gradient(160deg,#f6d365,#fda085)','linear-gradient(160deg,#3a2a1a,#4a2a1a)'],
    ['竹林','linear-gradient(160deg,#c2e59c,#64b3f4)','linear-gradient(160deg,#1a2a1a,#1a2a3a)'],
    ['薰衣草','linear-gradient(135deg,#e0c3fc,#8ec5fc)','linear-gradient(135deg,#221a3a,#1a2a3a)'],
    ['晨露','linear-gradient(160deg,#e8f5e9,#b2dfdb)','linear-gradient(160deg,#1a2320,#1a2a2a)']
  ];
  nature.forEach(([n,l,d]) => push('花草自然', n, l, d));
  const grads = [
    ['晨曦','linear-gradient(135deg,#ff9a9e,#fad0c4)','linear-gradient(135deg,#3a1a1e,#3a2a1e)'],
    ['橘霞','linear-gradient(135deg,#f6d365,#fda085)','linear-gradient(135deg,#3a2a1a,#3a1a0a)'],
    ['薄荷','linear-gradient(135deg,#d4fc79,#96e6a1)','linear-gradient(135deg,#1e2a1a,#1a2a1e)'],
    ['湖水','linear-gradient(135deg,#89f7fe,#66a6ff)','linear-gradient(135deg,#0d2a33,#1a2f5a)'],
    ['薰衣','linear-gradient(135deg,#e0c3fc,#8ec5fc)','linear-gradient(135deg,#221a3a,#1a2a3a)'],
    ['桃粉','linear-gradient(135deg,#fbc2eb,#a6c1ee)','linear-gradient(135deg,#2a1a2e,#1a2438)'],
    ['青柠','linear-gradient(135deg,#a1c4fd,#c2e9fb)','linear-gradient(135deg,#1a2438,#1a2a3a)'],
    ['暖沙','linear-gradient(135deg,#f5f7fa,#c3cfe2)','linear-gradient(135deg,#1e2024,#2a3038)'],
    ['蜜桃','linear-gradient(135deg,#ffecd2,#fcb69f)','linear-gradient(135deg,#3a2a1e,#3a201a)'],
    ['深海','linear-gradient(135deg,#2b5876,#4e4376)','linear-gradient(135deg,#0d1a26,#1a1430)'],
    ['薄荷蓝','linear-gradient(135deg,#a8edea,#fed6e3)','linear-gradient(135deg,#1a2a2a,#2a1e24)'],
    ['落日','linear-gradient(135deg,#ff7e5f,#feb47b)','linear-gradient(135deg,#3a1a12,#3a2a12)'],
    ['紫罗兰','linear-gradient(135deg,#7f00ff,#e100ff)','linear-gradient(135deg,#1a0a2a,#2a0a2a)'],
    ['苹果绿','linear-gradient(135deg,#d4fc79,#a1e4b8)','linear-gradient(135deg,#1e2a1a,#1a2a1e)'],
    ['云母','linear-gradient(135deg,#f5f7fa,#b8c6db)','linear-gradient(135deg,#1e2024,#2a303a)']
  ];
  grads.forEach(([n,l,d]) => push('渐变', n, l, d));
  const solids = [
    ['墨黑','#1a1a2e','#0e0e1a'],['米白','#faf7f0','#1e1e1e'],['暖灰','#e8e6e1','#202020'],
    ['雾蓝','#dce3ea','#1a2028'],['豆沙','#e8d8d0','#241e1a'],['奶油','#fdf6e3','#1e1c18'],
    ['黛绿','#d5e0d0','#182018'],['烟粉','#f0dfe0','#241a1a'],['浅沙','#efe8dc','#1e1c18'],['冰蓝','#e0eef2','#141e22']
  ];
  solids.forEach(([n,l,d]) => push('纯色', n, l, d));
  for (let i=1;i<=10;i++){ const hue=(i*36)%360; push('纸张纹理','纸纹'+i,`repeating-linear-gradient(0deg, rgba(0,0,0,.02) 0 2px, transparent 2px 4px), hsl(${hue},25%,92%)`,`repeating-linear-gradient(0deg, rgba(255,255,255,.02) 0 2px, transparent 2px 4px), hsl(${hue},20%,14%)`); }
  const geoShapes = ['linear-gradient(135deg,#e0eafc,#cfdef3)','linear-gradient(45deg,#f5f7fa,#c3cfe2)','linear-gradient(160deg,#e6e9f0,#eef1f5)','linear-gradient(135deg,#fdfbfb,#ebedee)','linear-gradient(160deg,#f0f4f8,#d9e2ec)','linear-gradient(135deg,#e8ecf1,#b8c6db)','linear-gradient(45deg,#f5f7fa,#b8c6db)','linear-gradient(160deg,#eef2f7,#c3cfe2)','linear-gradient(135deg,#f9fbfd,#cfd9df)','linear-gradient(160deg,#e6e9f0,#eef1f5)'];
  geoShapes.forEach((l,i)=>{ const d=l.replace(/#([0-9a-f]{6})/gi,(m,h)=>{const n=parseInt(h,16);const r=Math.max(10,Math.floor(((n>>16)&255)*0.15));const g=Math.max(10,Math.floor(((n>>8)&255)*0.15));const b=Math.max(10,Math.floor((n&255)*0.15));return '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');}); push('极简几何','几何'+(i+1),l,d); });
  const water = [

const K = { formulas:'fa_formulas', custom:'fa_custom', fav:'fa_fav', tags:'fa_tags', settings:'fa_settings', deleted:'fa_deleted' };
const Store = {
  get(k, d){ try{ const r=localStorage.getItem(k); return r?JSON.parse(r):d; }catch{ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch{ return false; } },
  getSettings(){ return this.get(K.settings, { theme:'auto', bgId:'bg-1', customBg:null, gradient:null }); },
  saveSettings(s){ this.set(K.settings, s); },
  getFav(){ return this.get(K.fav, []); },
  toggleFav(id){ const f=this.getFav(); const i=f.indexOf(id); if(i>=0) f.splice(i,1); else f.push(id); this.set(K.fav,f); return f; },
  getTags(){ return this.get(K.tags, []); },
  addTag(t){ const tags=this.getTags(); if(!tags.includes(t)){ tags.push(t); this.set(K.tags,tags); } },
  getCustom(){ return this.get(K.custom, {}); },
  saveCustom(id, d){ const c=this.getCustom(); c[id]=d; this.set(K.custom,c); },
  delCustom(id){ const c=this.getCustom(); delete c[id]; this.set(K.custom,c); },
  getDeleted(){ return this.get(K.deleted, []); },
  delBuiltin(id){ const d=this.getDeleted(); if(!d.includes(id)){ d.push(id); this.set(K.deleted,d); } },
  allFormulas(){ const b=FORMULAS; const c=this.getCustom(); const del=this.getDeleted(); const m=new Map(); b.forEach(f=>{ if(!del.includes(f.id)) m.set(f.id,f); }); Object.values(c).forEach(f=>m.set(f.id,f)); return [...m.values()]; },
  exportAll(){ return JSON.stringify({ version:1, exportedAt:new Date().toISOString(), custom:this.getCustom(), deleted:this.getDeleted(), fav:this.getFav(), tags:this.getTags(), settings:this.getSettings() }, null, 2); },
  importAll(str){ const d=JSON.parse(str); if(d.custom) this.set(K.custom,d.custom); if(d.deleted) this.set(K.deleted,d.deleted); if(d.fav) this.set(K.fav,d.fav); if(d.tags) this.set(K.tags,d.tags); if(d.settings) this.set(K.settings,d.settings); return true; }
};

/* ================= UI ================= */
const UI = {
  state: { query:'', subject:null, grade:null, module:null, tag:null, onlyFav:false, editingId:null, bgCat:'all' },
  init(){ this.cacheDom(); this.bindEvents(); this.renderFilters(); this.renderBackgrounds(); this.applyTheme(); this.render(); this.registerSW(); },
  cacheDom(){ const $=id=>document.getElementById(id); this.dom={ list:$('formula-list'), empty:$('empty-tip'), search:$('search-input'), filterPanel:$('filter-panel'), settingsPanel:$('settings-panel'), filterSubject:$('filter-subject'), filterGrade:$('filter-grade'), filterModule:$('filter-module'), filterTag:$('filter-tag'), onlyFav:$('only-fav'), bgCats:$('bg-categories'), bgGrid:$('bg-grid'), editModal:$('edit-modal'), batchModal:$('batch-modal'), toast:$('toast') }; },
  bindEvents(){
    const $=id=>document.getElementById(id);
    this.dom.search.addEventListener('input', e=>{ this.state.query=e.target.value.trim(); this.render(); });
    $('btn-filter').addEventListener('click',()=>this.togglePanel('filter'));
    $('btn-settings').addEventListener('click',()=>this.togglePanel('settings'));
    $('btn-close-filter').addEventListener('click',()=>this.togglePanel('filter',false));
    $('btn-close-settings').addEventListener('click',()=>this.togglePanel('settings',false));
    $('btn-clear-filter').addEventListener('click',()=>{ this.state.subject=this.state.grade=this.state.module=this.state.tag=null; this.state.onlyFav=false; this.dom.onlyFav.checked=false; this.renderFilters(); this.render(); });
    this.dom.onlyFav.addEventListener('change', e=>{ this.state.onlyFav=e.target.checked; this.render(); });
    document.querySelectorAll('[data-theme]').forEach(btn=>{ btn.addEventListener('click',()=>{ const s=Store.getSettings(); s.theme=btn.dataset.theme; Store.saveSettings(s); this.applyTheme(); }); });
    this.dom.bgCats.addEventListener('click', e=>{ const chip=e.target.closest('.chip'); if(!chip) return; this.state.bgCat=chip.dataset.cat; this.renderBackgrounds(); });
    this.dom.bgGrid.addEventListener('click', e=>{ const item=e.target.closest('.bg-item'); if(!item) return; const s=Store.getSettings(); s.bgId=item.dataset.id; s.customBg=null; s.gradient=null; Store.saveSettings(s); this.applyTheme(); });
    $('btn-upload-bg').addEventListener('click',()=>$('bg-upload').click());
    $('bg-upload').addEventListener('change', e=>{ const file=e.target.files[0]; if(!file) return; const r=new FileReader(); r.onload=()=>{ const s=Store.getSettings(); s.customBg=r.result; s.gradient=null; Store.saveSettings(s); this.applyTheme(); this.toast('背景已更新'); }; r.readAsDataURL(file); });
    $('btn-apply-grad').addEventListener('click',()=>{ const c1=$('grad-c1').value, c2=$('grad-c2').value; const s=Store.getSettings(); s.gradient=`linear-gradient(135deg, ${c1}, ${c2})`; s.customBg=null; Store.saveSettings(s); this.applyTheme(); this.toast('渐变背景已应用'); });
    $('btn-add').addEventListener('click',()=>this.openEdit(null));
    $('btn-cancel-formula').addEventListener('click',()=>this.closeEdit());
    $('btn-save-formula').addEventListener('click',()=>this.saveFormula());
    $('btn-batch').addEventListener('click',()=>this.dom.batchModal.classList.remove('hidden'));
    $('btn-batch-cancel').addEventListener('click',()=>this.dom.batchModal.classList.add('hidden'));
    $('btn-batch-import').addEventListener('click',()=>this.batchImport());
    $('btn-export').addEventListener('click',()=>this.exportBackup());
    $('btn-import').addEventListener('click',()=>$('import-file').click());
    $('import-file').addEventListener('change', e=>this.importBackup(e));
  },
  togglePanel(which, show){ const p=which==='filter'?this.dom.filterPanel:this.dom.settingsPanel; const o=which==='filter'?this.dom.settingsPanel:this.dom.filterPanel; if(typeof show==='undefined') show=p.classList.contains('hidden'); o.classList.add('hidden'); p.classList.toggle('hidden', !show); },
  renderFilters(){
    const all=Store.allFormulas();
    const subjects=[{v:null,t:'全部'},{v:'math',t:'数学'},{v:'physics',t:'物理'}];
    const grades=[{v:null,t:'全部'},{v:'g1',t:'高一'},{v:'g2',t:'高二'},{v:'g3',t:'高三'}];
    this.dom.filterSubject.innerHTML=subjects.map(s=>`<button class="chip${this.state.subject===s.v?' active':''}" data-v="${s.v??''}">${s.t}</button>`).join('');
    this.dom.filterGrade.innerHTML=grades.map(s=>`<button class="chip${this.state.grade===s.v?' active':''}" data-v="${s.v??''}">${s.t}</button>`).join('');
    const pool=all.filter(f=>(!this.state.subject||f.subject===this.state.subject)&&(!this.state.grade||f.grade===this.state.grade));
    const modules=[...new Set(pool.map(f=>f.module))];
    this.dom.filterModule.innerHTML=`<button class="chip${!this.state.module?' active':''}" data-v="">全部</button>`+modules.map(m=>`<button class="chip${this.state.module===m?' active':''}" data-v="${m}">${m}</button>`).join('');
    const tags=Store.getTags();
    this.dom.filterTag.innerHTML=`<button class="chip${!this.state.tag?' active':''}" data-v="">全部</button>`+tags.map(t=>`<button class="chip${this.state.tag===t?' active':''}" data-v="${t}">${t}</button>`).join('');
    const bind=(el,key)=>{ el.onclick=e=>{ const chip=e.target.closest('.chip'); if(!chip) return; this.state[key]=chip.dataset.v||null; this.renderFilters(); this.render(); }; };
    bind(this.dom.filterSubject,'subject'); bind(this.dom.filterGrade,'grade'); bind(this.dom.filterModule,'module'); bind(this.dom.filterTag,'tag');
  },
  renderBackgrounds(){
    const cats=['all',...BACKGROUNDS.categories];
    this.dom.bgCats.innerHTML=cats.map(c=>`<button class="chip${this.state.bgCat===c?' active':''}" data-cat="${c}">${c==='all'?'全部':c}</button>`).join('');
    const s=Store.getSettings(); const dark=document.body.classList.contains('dark');
    const list=BACKGROUNDS.list.filter(b=>this.state.bgCat==='all'||b.cat===this.state.bgCat);
    this.dom.bgGrid.innerHTML=list.map(b=>{ const css=dark?b.cssDark:b.cssLight; return `<div class="bg-item${s.bgId===b.id?' active':''}" data-id="${b.id}" title="${b.name}"><div class="bg-preview" style="background:${css}"></div><span>${b.name}</span></div>`; }).join('');
  },
  applyTheme(){
    const s=Store.getSettings(); let dark=false;
    if(s.theme==='dark') dark=true; else if(s.theme==='auto') dark=window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.body.classList.toggle('dark',dark); document.body.classList.toggle('light',!dark);
    document.body.style.background='';
    if(s.customBg){ document.body.style.background=`url(${s.customBg}) center/cover fixed`; }
    else if(s.gradient){ document.body.style.background=s.gradient+' fixed'; }
    else { const bg=BACKGROUNDS.byId[s.bgId]||BACKGROUNDS.list[0]; document.body.style.background=(dark?bg.cssDark:bg.cssLight)+' fixed'; }
    if(this.dom.bgGrid) this.renderBackgrounds();
  },
  filterList(){
    const fav=Store.getFav(); let list=Store.allFormulas(); const q=this.state.query.toLowerCase();
    if(q) list=list.filter(f=>(f.title||'').toLowerCase().includes(q)||(f.latex||'').toLowerCase().includes(q)||(f.desc||'').toLowerCase().includes(q)||(f.usage||'').toLowerCase().includes(q)||(f.module||'').toLowerCase().includes(q)||(f.tags||[]).some(t=>t.toLowerCase().includes(q)));
    if(this.state.subject) list=list.filter(f=>f.subject===this.state.subject);
    if(this.state.grade) list=list.filter(f=>f.grade===this.state.grade);
    if(this.state.module) list=list.filter(f=>f.module===this.state.module);
    if(this.state.tag) list=list.filter(f=>(f.tags||[]).includes(this.state.tag));
    if(this.state.onlyFav) list=list.filter(f=>fav.includes(f.id));
    return list;
  },
  render(){
    const list=this.filterList(); const fav=Store.getFav();
    if(!list.length){ this.dom.list.innerHTML=''; this.dom.empty.classList.remove('hidden'); return; }
    this.dom.empty.classList.add('hidden');
    const groups={}; list.forEach(f=>{ const key=`${f.subject}|${f.grade}|${f.module}`; (groups[key]=groups[key]||[]).push(f); });
    const sn={math:'数学',physics:'物理'}; const gn={g1:'高一',g2:'高二',g3:'高三'};
    const keys=Object.keys(groups).sort((a,b)=>{ const[sa,ga]=a.split('|'),[sb,gb]=b.split('|'); const so={math:0,physics:1}; return so[sa]-so[sb]||ga.localeCompare(gb)||a.localeCompare(b); });
    let html='';
    keys.forEach(key=>{ const[subject,grade,module]=key.split('|'); html+=`<h2 class="group-title">${sn[subject]||subject} · ${gn[grade]||grade} · ${module}</h2>`; groups[key].forEach(f=>{ html+=this.renderCard(f,fav.includes(f.id)); }); });
    this.dom.list.innerHTML=html;
    this.bindCardEvents(); this.renderLatex();
  },
  renderCard(f,isFav){
    const tags=(f.tags||[]).map(t=>`<span class="tag">${t}</span>`).join('');
    const variants=(f.variants||[]).filter(Boolean).map(v=>`<div class="variant">${this.escapeHtml(v)}</div>`).join('');
    return `<article class="card" data-id="${f.id}">
      <div class="card-head"><h3 class="card-title">${this.escapeHtml(f.title||'')}</h3><div class="card-actions">
      <button class="icon-btn fav-btn ${isFav?'active':''}" data-action="fav">${isFav?'★':'☆'}</button>
      <button class="icon-btn" data-action="edit">✎</button>
      <button class="icon-btn" data-action="del">🗑</button></div></div>
      <div class="formula">$$${f.latex||''}$$</div>
      ${variants?`<div class="section"><span class="label">等价变形</span>${variants}</div>`:''}
      ${f.usage?`<div class="section"><span class="label">典型应用</span><div class="text">${this.escapeHtml(f.usage)}</div></div>`:''}
      ${f.desc?`<div class="section"><span class="label">说明</span><div class="text">${this.escapeHtml(f.desc)}</div></div>`:''}
      <div class="meta">${f.cond?`<span class="meta-item"><b>适用条件</b>${this.escapeHtml(f.cond)}</span>`:''}${f.unit?`<span class="meta-item"><b>单位</b>${this.escapeHtml(f.unit)}</span>`:''}</div>
      ${tags?`<div class="tags">${tags}</div>`:''}
    </article>`;
  },
  bindCardEvents(){
    if(this._cardBound) return; this._cardBound=true;
    this.dom.list.addEventListener('click', e=>{
      const btn=e.target.closest('[data-action]'); if(!btn) return;
      const card=btn.closest('.card'); const id=card.dataset.id; const action=btn.dataset.action;
      if(action==='fav'){ const fav=Store.toggleFav(id); btn.classList.toggle('active',fav.includes(id)); btn.textContent=fav.includes(id)?'★':'☆'; if(this.state.onlyFav) this.render(); }
      else if(action==='edit'){ this.openEdit(id); }
      else if(action==='del'){ this.confirmDelete(id); }
    });
  },
  renderLatex(){ if(window.renderMathInElement){ try{ renderMathInElement(this.dom.list,{ delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}], throwOnError:false }); }catch(e){} } },
  openEdit(id){
    this.state.editingId=id; const f=id?Store.allFormulas().find(x=>x.id===id):null; const $=x=>document.getElementById(x);
    $('edit-title').textContent=id?'编辑公式':'添加公式';
    $('f-title').value=f?.title||''; $('f-latex').value=f?.latex||''; $('f-variants').value=(f?.variants||[]).join('\n');
    $('f-usage').value=f?.usage||''; $('f-desc').value=f?.desc||''; $('f-cond').value=f?.cond||''; $('f-unit').value=f?.unit||'';
    $('f-subject').value=f?.subject||'math'; $('f-grade').value=f?.grade||'g1'; $('f-module').value=f?.module||''; $('f-tags').value=(f?.tags||[]).join(',');
    this.dom.editModal.classList.remove('hidden');
  },
  closeEdit(){ this.dom.editModal.classList.add('hidden'); this.state.editingId=null; },
  saveFormula(){
    const $=x=>document.getElementById(x); const title=$('f-title').value.trim(); const latex=$('f-latex').value.trim();
    if(!title||!latex){ this.toast('标题和公式不能为空'); return; }
    const tags=$('f-tags').value.split(/[,，]/).map(s=>s.trim()).filter(Boolean); tags.forEach(t=>Store.addTag(t));
    const data={ id:this.state.editingId||('user-'+Date.now()), title, latex, variants:$('f-variants').value.split('\n').map(s=>s.trim()).filter(Boolean), usage:$('f-usage').value.trim(), desc:$('f-desc').value.trim(), cond:$('f-cond').value.trim(), unit:$('f-unit').value.trim(), subject:$('f-subject').value, grade:$('f-grade').value, module:$('f-module').value.trim()||'未分类', tags };
    Store.saveCustom(data.id,data); this.closeEdit(); this.renderFilters(); this.render(); this.toast('已保存');
  },
  confirmDelete(id){ if(!confirm('确定删除这条公式吗？')) return; Store.delCustom(id); Store.delBuiltin(id); this.renderFilters(); this.render(); this.toast('已删除'); },
  batchImport(){
    const text=document.getElementById('batch-text').value.trim(); if(!text){ this.toast('请输入内容'); return; }
    try{ let arr=JSON.parse(text); if(!Array.isArray(arr)) arr=[arr]; let count=0;
      arr.forEach((item,i)=>{ if(!item.title||!item.latex) return; const data={ id:item.id||('batch-'+Date.now()+'-'+i), title:item.title, latex:item.latex, variants:item.variants||[], usage:item.usage||'', desc:item.desc||'', cond:item.cond||'', unit:item.unit||'', subject:item.subject||'math', grade:item.grade||'g1', module:item.module||'未分类', tags:item.tags||[] }; (data.tags||[]).forEach(t=>Store.addTag(t)); Store.saveCustom(data.id,data); count++; });
      this.dom.batchModal.classList.add('hidden'); document.getElementById('batch-text').value=''; this.renderFilters(); this.render(); this.toast(`已导入 ${count} 条`);
    }catch(e){ this.toast('JSON 格式错误：'+e.message); }
  },
  exportBackup(){ const json=Store.exportAll(); const blob=new Blob([json],{type:'application/json'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=`formula-backup-${new Date().toISOString().slice(0,10)}.json`; a.click(); URL.revokeObjectURL(url); this.toast('已导出备份'); },
  importBackup(e){ const file=e.target.files[0]; if(!file) return; const r=new FileReader(); r.onload=()=>{ try{ Store.importAll(r.result); this.applyTheme(); this.renderFilters(); this.render(); this.toast('导入成功'); }catch(err){ this.toast('导入失败：'+err.message); } }; r.readAsText(file); e.target.value=''; },
  escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); },
  toast(msg){ const el=this.dom.toast; el.textContent=msg; el.classList.remove('hidden'); clearTimeout(this._t); this._t=setTimeout(()=>el.classList.add('hidden'),2000); },
  registerSW(){
    if('serviceWorker' in navigator){
      const swCode = `
        const C='formula-single-v1';
        self.addEventListener('install',e=>{ self.skipWaiting(); });
        self.addEventListener('activate',e=>{ e.waitUntil(clients.claim()); });
        self.addEventListener('fetch',e=>{
          if(e.request.method!=='GET') return;
          e.respondWith(caches.match(e.request).then(c=>c||fetch(e.request).then(r=>{ const copy=r.clone(); caches.open(C).then(ca=>ca.put(e.request,copy)).catch(()=>{}); return r; }).catch(()=>c)));
        });
      `;
      try{
        const blob=new Blob([swCode],{type:'application/javascript'});
        const url=URL.createObjectURL(blob);
        navigator.serviceWorker.register(url).catch(()=>{});
      }catch(e){}
    }
  }
};

document.addEventListener('DOMContentLoaded',()=>{
  UI.init();
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{ if(Store.getSettings().theme==='auto') UI.applyTheme(); });
  window.addEventListener('load',()=>{ setTimeout(()=>UI.render(),400); });
});
</script>
</body>
</html>
